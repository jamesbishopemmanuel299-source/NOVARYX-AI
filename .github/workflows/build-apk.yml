name: Build Small Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform project if missing
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --project-name novaryx_ai
          fi

      - name: Set Android compile SDK to 36
        shell: bash
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i -E 's/^[[:space:]]*compileSdk[[:space:]]*=[[:space:]]*.*/    compileSdk = 36/' android/app/build.gradle.kts
            grep -n 'compileSdk' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i -E 's/^[[:space:]]*compileSdk(Version)?[[:space:]]+.*$/    compileSdk 36/' android/app/build.gradle
            grep -n 'compileSdk' android/app/build.gradle
          else
            echo "Android app Gradle file not found" >&2
            exit 1
          fi

      - name: Convert SVG launcher artwork to PNG
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 1024 -h 1024 assets/branding/novaryx_app_icon.svg -o assets/branding/novaryx_app_icon.png
          file assets/branding/novaryx_app_icon.png

      - name: Install dependencies
        run: flutter pub get

      - name: Patch cached Flutter plugins to compile with Android SDK 36
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path.home() / ".pub-cache" / "hosted" / "pub.dev"
          changed = []
          if root.exists():
              for path in root.glob("*/android/build.gradle*"):
                  try:
                      source = path.read_text()
                  except (OSError, UnicodeError):
                      continue
                  updated = source
                  updated = re.sub(r'(?m)^(\s*compileSdkVersion\s+)\d+', r'\g<1>36', updated)
                  updated = re.sub(r'(?m)^(\s*compileSdk\s*=\s*)\d+', r'\g<1>36', updated)
                  updated = re.sub(r'(?m)^(\s*compileSdk\s+)\d+', r'\g<1>36', updated)
                  updated = updated.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 36')
                  updated = updated.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
                  if updated != source:
                      path.write_text(updated)
                      changed.append(str(path))
          print(f"Patched {len(changed)} cached plugin Gradle files for compile SDK 36")
          for path in changed:
              print(path)
          PY

      - name: Apply the committed NOVARYX launcher artwork
        run: dart run flutter_launcher_icons

      - name: Enable Android code and resource shrinking
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          gradle = next((p for p in candidates if p.exists()), None)
          if gradle is None:
              raise SystemExit("Android app Gradle file not found")
          text = gradle.read_text()
          match = re.search(r'\brelease\s*\{', text)
          if not match:
              raise SystemExit(f"Could not locate release build type in {gradle}")
          start = match.end()
          depth = 1
          i = start
          while i < len(text) and depth:
              if text[i] == "{":
                  depth += 1
              elif text[i] == "}":
                  depth -= 1
              i += 1
          if depth:
              raise SystemExit(f"Unbalanced release block in {gradle}")
          block = text[match.start():i]
          kotlin = gradle.suffix == ".kts"
          settings = [
              (r'(?m)^([ \t]*)isMinifyEnabled\s*=\s*(?:true|false)', r'\1isMinifyEnabled = true',
               '            isMinifyEnabled = true'),
              (r'(?m)^([ \t]*)isShrinkResources\s*=\s*(?:true|false)', r'\1isShrinkResources = true',
               '            isShrinkResources = true'),
          ] if kotlin else [
              (r'(?m)^([ \t]*)minifyEnabled\s+(?:true|false)', r'\1minifyEnabled true',
               '            minifyEnabled true'),
              (r'(?m)^([ \t]*)shrinkResources\s+(?:true|false)', r'\1shrinkResources true',
               '            shrinkResources true'),
          ]
          additions = []
          for pattern, replacement, line in settings:
              if re.search(pattern, block):
                  block = re.sub(pattern, replacement, block, count=1)
              else:
                  additions.append(line)
          if not re.search(r'(?m)^\s*proguardFiles\b', block):
              additions.append(
                  '            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"))'
                  if kotlin else
                  '            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt")'
              )
          if additions:
              opening = re.search(r'\brelease\s*\{', block)
              block = block[:opening.end()] + "\n" + "\n".join(additions) + block[opening.end():]
          text = text[:match.start()] + block + text[i:]
          gradle.write_text(text)
          print(f"Enabled R8 and resource shrinking in {gradle}")
          for line_no, line in enumerate(text.splitlines(), 1):
              if any(token in line for token in ("isMinifyEnabled", "isShrinkResources", "minifyEnabled", "shrinkResources", "proguardFiles")):
                  print(f"{line_no}: {line.strip()}")
          PY

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Build one universal release APK
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: >-
          flutter build apk --release
          --obfuscate --tree-shake-icons --split-debug-info=build/symbols
          --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Report universal APK size
        run: |
          find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' -exec ls -lh {} \;
          find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' -exec du -h {} \;

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: novaryx-universal-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
