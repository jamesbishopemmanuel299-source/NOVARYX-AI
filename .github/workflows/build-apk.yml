name: Build Small Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform project if missing
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --project-name novaryx_ai
          fi

      - name: Set Android compile SDK to 36
        shell: bash
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i -E 's/^[[:space:]]*compileSdk[[:space:]]*=[[:space:]]*.*/    compileSdk = 36/' android/app/build.gradle.kts
            grep -n 'compileSdk' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i -E 's/^[[:space:]]*compileSdk(Version)?[[:space:]]+.*$/    compileSdk 36/' android/app/build.gradle
            grep -n 'compileSdk' android/app/build.gradle
          else
            echo "Android app Gradle file not found" >&2
            exit 1
          fi

      - name: Convert SVG launcher artwork to PNG
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 1024 -h 1024 assets/branding/novaryx_app_icon.svg -o assets/branding/novaryx_app_icon.png
          file assets/branding/novaryx_app_icon.png

      - name: Install dependencies
        run: flutter pub get

      - name: Patch cached Flutter plugins to compile with Android SDK 36
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path.home() / ".pub-cache" / "hosted" / "pub.dev"
          changed = []
          if root.exists():
              for path in root.glob("*/android/build.gradle*"):
                  try:
                      source = path.read_text()
                  except (OSError, UnicodeError):
                      continue
                  updated = source
                  updated = re.sub(r'(?m)^(\s*compileSdkVersion\s+)\d+', r'\g<1>36', updated)
                  updated = re.sub(r'(?m)^(\s*compileSdk\s*=\s*)\d+', r'\g<1>36', updated)
                  updated = re.sub(r'(?m)^(\s*compileSdk\s+)\d+', r'\g<1>36', updated)
                  updated = updated.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 36')
                  updated = updated.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
                  if updated != source:
                      path.write_text(updated)
                      changed.append(str(path))
          print(f"Patched {len(changed)} cached plugin Gradle files for compile SDK 36")
          for path in changed:
              print(path)
          PY

      - name: Apply the committed NOVARYX launcher artwork
        run: dart run flutter_launcher_icons

      - name: Enable Android code and resource shrinking
        shell: bash
        run: |
          GRADLE_FILE="android/app/build.gradle.kts"
          if [ -f "$GRADLE_FILE" ]; then
            sed -i 's/isMinifyEnabled = false/isMinifyEnabled = true/' "$GRADLE_FILE"
            sed -i 's/isShrinkResources = false/isShrinkResources = true/' "$GRADLE_FILE"
          else
            GRADLE_FILE="android/app/build.gradle"
            if [ -f "$GRADLE_FILE" ]; then
              sed -i 's/minifyEnabled false/minifyEnabled true/' "$GRADLE_FILE"
              sed -i 's/shrinkResources false/shrinkResources true/' "$GRADLE_FILE"
            fi
          fi
          echo "Using release config in $GRADLE_FILE"
          grep -nE 'isMinifyEnabled|isShrinkResources|minifyEnabled|shrinkResources' "$GRADLE_FILE" || true

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Build optimized ARM64 release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: >-
          flutter build apk --release --split-per-abi --target-platform android-arm64
          --obfuscate --split-debug-info=build/symbols
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Report APK size
        run: |
          find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' -exec ls -lh {} \;
          find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' -exec du -h {} \;

      - name: Upload optimized APK
        uses: actions/upload-artifact@v4
        with:
          name: novaryx-arm64-release-apk
          path: build/app/outputs/flutter-apk/*arm64-v8a-release.apk
          if-no-files-found: error
