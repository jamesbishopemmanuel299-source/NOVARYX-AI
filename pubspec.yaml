name: novaryx_ai
description: NOVARYX-AI — chat, image, music, and video generation.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  url_launcher: ^6.3.1
  record: ^6.1.2
  file_picker: ^8.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/novaryx_app_icon.png
  adaptive_icon_background: "#05091B"
  adaptive_icon_foreground: assets/branding/novaryx_app_icon.png
